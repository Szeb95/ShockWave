name: Source checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and fixture checks
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Restore locked bridge dependencies
        working-directory: bridge
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
      - name: Check bridge with fixtures and loopback peers
        run: |
          $bridgeTests = @(Get-ChildItem -LiteralPath bridge -Filter '*.test.mjs' | ForEach-Object FullName)
          node --test @bridgeTests
          if ($LASTEXITCODE -ne 0) { throw 'Bridge checks failed.' }
      - name: Prepare pinned SteamVR library
        run: ./overlay/prepare-steamvr.ps1
      - name: Build Windows app without launching it
        run: |
          dotnet build overlay/ShockWave.Overlay.csproj --configuration Release -p:IncludeLegacyLovense=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
      - name: Check integrated SteamVR panel with simulated devices
        run: |
          $app = Join-Path $PWD 'overlay/bin/Release/net8.0-windows/win-x64/ShockWave.dll'
          # The fake stable-input installation must be beneath this test user's
          # profile, even when GitHub checks the source out on another drive.
          $output = Join-Path ([Environment]::GetFolderPath('UserProfile')) 'ShockWave-integrated-panel-checks'
          dotnet $app --panel-self-test $output
          if ($LASTEXITCODE -ne 0) {
            $failure = Join-Path $output 'failure.txt'
            if (Test-Path -LiteralPath $failure) { Get-Content -LiteralPath $failure }
            throw "Integrated panel checks failed with exit code $LASTEXITCODE."
          }
          $report = Get-Content -LiteralPath (Join-Path $output 'panel-integration.json') -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.total -lt 171) { throw 'Integrated panel verification is incomplete.' }
      - name: Check update validation, rollback and interface with fixtures
        run: |
          dotnet build tests/update/Update.Checks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Update fixture build failed.' }
          ./tests/update/bin/Release/net8.0-windows/Update.Checks.exe
          if ($LASTEXITCODE -ne 0) { throw 'Update checks failed.' }
      - name: Check unchanged public updater compatibility
        run: |
          foreach ($legacy in @('0.7.0', '0.7.11', '0.8.0')) {
            dotnet run --project tests/update-compat/UpdaterCompatibility.Checks.csproj -c Release "-p:LegacyVersion=$legacy" -- --output "work/legacy-updater-checks/$legacy"
            if ($LASTEXITCODE -ne 0) { throw "Legacy updater checks failed: $legacy" }
          }
      - name: Verify nested native SteamVR library without starting VR
        run: |
          $app = Join-Path $PWD 'overlay/bin/Release/net8.0-windows/win-x64/ShockWave.dll'
          $output = Join-Path $PWD 'work/native-library-checks'
          dotnet $app --steamvr-library-check $output
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $output 'failure.txt'); throw 'Native library verification failed.' }
      - name: Check panel pointer and selection with simulated devices
        run: |
          dotnet run --project tests/toy-control/ToyControl.Checks.csproj -c Release -- work/panel-fixture-checks --warp
          if ($LASTEXITCODE -ne 0) { throw 'Panel pointer checks failed.' }
      - name: Check remote ownership and SPS handoff with simulated toys
        run: |
          dotnet build tests/remote/Remote.Checks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Remote fixture build failed.' }
          ./tests/remote/bin/Release/net8.0-windows/Remote.Checks.exe
          if ($LASTEXITCODE -ne 0) { throw 'Remote ownership checks failed.' }
          dotnet build tests/sps/Sps.Checks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'SPS fixture build failed.' }
          ./tests/sps/bin/Release/net8.0-windows/win-x64/Sps.Checks.exe
          if ($LASTEXITCODE -ne 0) { throw 'SPS handoff checks failed.' }
