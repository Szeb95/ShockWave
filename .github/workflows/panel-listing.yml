name: Publish Creator Companion listing
on:
  push:
    branches: [main]
    paths: ['vpm/**', '.github/workflows/panel-listing.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: vpm
      - name: Deploy listing
        id: deployment
        uses: actions/deploy-pages@v5
